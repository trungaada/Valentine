<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nhập ngày sinh của em iu 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff79ac;
      --primary-dark: #ff4d88;
      --accent: #ff9ec1;
      --glass: rgba(255, 255, 255, 0.78);
      --shadow: 0 12px 32px rgba(255, 105, 180, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f9e1e8 0%, #e0f7fa 100%);
      font-family: 'Quicksand', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
      animation: float linear infinite;
      transform: translateX(-50%);
    }

    @keyframes float {
      0%   { transform: translateY(100vh) translateX(-50%); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-150px) translateX(-50%); opacity: 0; }
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 2.5rem 1.8rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: var(--shadow);
      text-align: center;
      animation: appear 0.7s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      color: var(--primary-dark);
      margin-bottom: 0.6rem;
      text-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 2rem;
    }

    #birthday {
      width: 100%;
      padding: 1.1rem;
      font-size: 2rem;
      text-align: center;
      border: 2px solid rgba(255, 182, 193, 0.6);
      border-radius: 16px;
      background: rgba(255, 245, 247, 0.6);
      color: var(--primary-dark);
      font-weight: 600;
      letter-spacing: 3px;
      margin-bottom: 1.8rem;
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .key {
      aspect-ratio: 1;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }

    .key:hover {
      background: var(--accent);
      color: white;
    }

    .key.action {
      background: #ffe4e9;
      color: var(--primary-dark);
    }

    .confirm-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 79, 172, 0.35);
    }

    #result {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      font-weight: 600;
      min-height: 2rem;
    }

    .success {
      color: var(--primary-dark);
      animation: pop 0.6s ease, heartbeat 1.5s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* RUNG */
    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    /* TIM BAY */
    .heart {
      position: fixed;
      font-size: 22px;
      animation: fly 2s linear forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) scale(1.8); opacity: 0; }
    }

    /* TIM RƠI XUỐNG */
    .fall-heart {
      position: fixed;
      top: -40px;
      font-size: 22px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>

<body>

<div class="bubbles" id="bubbles"></div>

<div class="container">
  <h2>💕 Ngày sinh em iu 💕</h2>
  <div class="subtitle">Nhập đúng để nhận quà đặc biệt từ anh nha~ 🥰</div>

  <input type="text" id="birthday" placeholder="Ngày/Tháng/Năm" readonly>

  <div class="keyboard">
    <button class="key" onclick="addNumber('1')">1</button>
    <button class="key" onclick="addNumber('2')">2</button>
    <button class="key" onclick="addNumber('3')">3</button>
    <button class="key" onclick="addNumber('4')">4</button>
    <button class="key" onclick="addNumber('5')">5</button>
    <button class="key" onclick="addNumber('6')">6</button>
    <button class="key" onclick="addNumber('7')">7</button>
    <button class="key" onclick="addNumber('8')">8</button>
    <button class="key" onclick="addNumber('9')">9</button>
    <button class="key" onclick="addNumber('0')">0</button>
    <button class="key action" onclick="delChar()">⌫</button>
    <button class="key action" onclick="clearAll()">C</button>
  </div>

  <button class="confirm-btn" onclick="checkDate()">XÁC NHẬN 💖</button>
  <div id="result"></div>
</div>

<script>
const correctDate = "14/02/2005";

/* bong bóng */
const bubbles = document.getElementById('bubbles');
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = Math.random() * 35 + 12;
  b.style.width = b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + '%';
  b.style.animationDuration = (Math.random() * 12 + 10) + 's';
  b.style.animationDelay = Math.random() * -15 + 's';
  bubbles.appendChild(b);
}

function formatInput(value) {
  const input = document.getElementById("birthday");
  if (value.length >= 5)
    input.value = value.slice(0,2)+"/"+value.slice(2,4)+"/"+value.slice(4);
  else if (value.length >= 3)
    input.value = value.slice(0,2)+"/"+value.slice(2);
  else input.value = value;
}

function addNumber(num) {
  let value = document.getElementById("birthday").value.replace(/\//g,"");
  if (value.length >= 8) return;
  formatInput(value + num);
}

function delChar() {
  let value = document.getElementById("birthday").value.replace(/\//g,"");
  formatInput(value.slice(0,-1));
}

function clearAll() {
  document.getElementById("birthday").value = "";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "20px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),2000);
}

/* tim rơi liên tục */
function createFallingHeart() {
  const h = document.createElement("div");
  h.className = "fall-heart";
  h.innerHTML = "💗";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
}
setInterval(createFallingHeart, 500);

function checkDate() {
  const input = document.getElementById("birthday");
  const result = document.getElementById("result");

  if (input.value !== correctDate) {
    input.classList.add("shake");
    alert("Sai rồi nè 😢 Thử lại đi mà~");
    setTimeout(()=>input.classList.remove("shake"),400);
    result.innerText = "";
    return;
  }

  result.innerText = "Đúng rồi! Anh nhớ mãi không quên 💕💕";
  result.className = "success";

  let i=0;
  const timer = setInterval(()=>{
    createHeart();
    i++;
    if(i>20) clearInterval(timer);
  },120);
}
</script>

</body>
</html>
