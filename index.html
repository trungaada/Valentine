<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nhập ngày sinh của Nhi 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff79ac;
      --primary-dark: #ff4d88;
      --accent: #ff9ec1;
      --glass: rgba(255, 255, 255, 0.78);
      --shadow: 0 12px 32px rgba(255, 105, 180, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f9e1e8 0%, #e0f7fa 100%);
      font-family: 'Quicksand', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
      animation: float linear infinite;
      transform: translateX(-50%);
    }

    @keyframes float {
      0%   { transform: translateY(100vh) translateX(-50%); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-150px) translateX(-50%); opacity: 0; }
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 2rem 1.8rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: var(--shadow);
      text-align: center;
      animation: appear 0.7s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-section {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 1.5rem;
    }

    .heart-frame {
      position: absolute;
      inset: 0;
      background: url('https://www.citypng.com/public/uploads/preview/free-romantic-heart-shape-border-frame-png-11664778172q1zq3u1z3z.png') center/cover no-repeat;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(255, 105, 180, 0.4));
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      clip-path: url(#heartClip); /* Dùng clip-path để bo theo tim nếu muốn chính xác hơn */
      box-shadow: inset 0 0 20px rgba(255, 105, 180, 0.3);
    }

    /* Nếu muốn clip-path tim chính xác, thêm SVG clipPath */
    svg { position: absolute; width: 0; height: 0; }

    h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      color: var(--primary-dark);
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
    }

    .subtitle {
      color: #6b7280;
      font-size: 1rem;
      margin-bottom: 1.8rem;
    }

    #birthday {
  width: 100%;
  padding: 1rem;
  font-size: clamp(1.3rem, 4vw, 1.7rem); /* nhỏ lại */
  text-align: center;
  border: 2px solid rgba(255, 182, 193, 0.6);
  border-radius: 16px;
  background: rgba(255, 245, 247, 0.6);
  color: var(--primary-dark);
  font-weight: 600;
  letter-spacing: 2px; /* giảm giãn chữ */
  margin-bottom: 1.6rem;
}


.keyboard-frame {
  background-image: url("4.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  padding: clamp(8px, 2vw, 14px);
  border-radius: 20px;
  box-shadow: 0 6px 18px rgba(255,105,180,0.35);
  margin: 0 auto 1.5rem auto;

  width: 100%;
  max-width: 420px;   /* từ 360px -> 420px */
}


/* LƯỚI BÀN PHÍM */
.keyboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(0.4rem, 1.5vw, 0.7rem);

  background: rgba(255,255,255,0.65);
  padding: clamp(8px, 2vw, 12px);
  border-radius: 16px;

  justify-items: center;
  align-items: center;
}

/* NÚT */
.key {
  width: 100%;
  aspect-ratio: 1 / 1;
  font-size: clamp(1rem, 3vw, 1.4rem);
  font-weight: 600;
  border: none;
  border-radius: 50%; /* nút tròn */
  background: white;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.06);
  transition: all 0.15s ease;
}

/* hover cho PC */
@media (hover: hover) {
  .key:hover {
    background: var(--accent);
    color: white;
    transform: translateY(-2px);
  }
}

/* bấm cho mobile */
.key:active {
  transform: scale(0.95);
  background: var(--accent);
  color: white;
}

.key.action {
  background: #ffe4e9;
  color: var(--primary-dark);
}


    .confirm-btn {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 79, 172, 0.35);
      transition: all 0.25s;
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 79, 172, 0.45);
    }

    #result {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      font-weight: 600;
      min-height: 2rem;
    }

    .success {
      color: var(--primary-dark);
      animation: pop 0.6s ease, heartbeat 1.5s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    .heart {
      position: fixed;
      font-size: 22px;
      animation: fly 2s linear forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150px) scale(1.8); opacity: 0; }
    }

    .fall-heart {
      position: fixed;
      top: -40px;
      font-size: 22px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

#transition {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffe4ef, #fff0f6);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}

#transition.show {
  opacity: 1;
}



  </style>
</head>

<body>


  <div id="transition"></div>

<div class="bubbles" id="bubbles"></div>

<div class="container">
  <!-- Khung ảnh ny -->
  <div class="profile-section">
    <img class="profile-img" src="9.jpg" alt="Em iu của anh 💕">
    <!-- Khung tim overlay -->
    <div class="heart-frame"></div>
  </div>

  <h2>💕 Ngày sinh  của Nhi 💕</h2>
  <div class="subtitle">Nhập đúng để nhận quà đặc biệt từ anh nha~ 🥰</div>

  <input type="text" id="birthday" placeholder="Ngày/Tháng/Năm" readonly>

 <div class="keyboard-frame">
  <div class="keyboard">
    <button class="key" onclick="addNumber('1')">1</button>
    <button class="key" onclick="addNumber('2')">2</button>
    <button class="key" onclick="addNumber('3')">3</button>
    <button class="key" onclick="addNumber('4')">4</button>
    <button class="key" onclick="addNumber('5')">5</button>
    <button class="key" onclick="addNumber('6')">6</button>
    <button class="key" onclick="addNumber('7')">7</button>
    <button class="key" onclick="addNumber('8')">8</button>
    <button class="key" onclick="addNumber('9')">9</button>
    <button class="key" onclick="addNumber('0')">0</button>
    <button class="key action" onclick="delChar()">⌫</button>
    <button class="key action" onclick="clearAll()">C</button>
  </div>
</div>


  <button class="confirm-btn" onclick="checkDate()">XÁC NHẬN 💖</button>
  <div id="result"></div>
</div>

<!-- SVG cho clip-path tim (nếu muốn chính xác hơn thay vì overlay) -->
<svg width="0" height="0">
  <defs>
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
      <path d="M0.5,0.15 C0.85,0 1,0.3 1,0.6 C1,0.9 0.75,1 0.5,1 C0.25,1 0,0.9 0,0.6 C0,0.3 0.15,0 0.5,0.15 Z" />
    </clipPath>
  </defs>
</svg>

<script>
const correctDate = "29/05/2010";

// Bong bóng
const bubbles = document.getElementById('bubbles');
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div');
  const size = Math.random() * 35 + 12;
  b.style.width = b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + '%';
  b.style.animationDuration = (Math.random() * 12 + 10) + 's';
  b.style.animationDelay = Math.random() * -15 + 's';
  bubbles.appendChild(b);
}

function formatInput(value) {
  const input = document.getElementById("birthday");

  if (value.length >= 5)
    input.value = value.slice(0,2)+"/"+value.slice(2,4)+"/"+value.slice(4);
  else if (value.length >= 3)
    input.value = value.slice(0,2)+"/"+value.slice(2);
  else input.value = value;
}

function addNumber(num) {
  let value = document.getElementById("birthday").value.replace(/\//g,"");
  if (value.length >= 8) return;
  formatInput(value + num);
}

function delChar() {
  let value = document.getElementById("birthday").value.replace(/\//g,"");
  formatInput(value.slice(0,-1));
}

function clearAll() {
  document.getElementById("birthday").value = "";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "20px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),2000);
}

function createFallingHeart() {
  const h = document.createElement("div");
  h.className = "fall-heart";
  h.innerHTML = "💗";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
}
setInterval(createFallingHeart, 500);

document.querySelectorAll(".key").forEach(btn => {
  btn.addEventListener("pointerdown", e => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";

    heart.style.left = e.clientX + "px";
    heart.style.top = e.clientY + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 800);
  });
});

function checkDate() {
  const input = document.getElementById("birthday");
  const result = document.getElementById("result");
  const transition = document.getElementById("transition");

  if (input.value !== correctDate) {
    input.classList.add("shake");
    alert("Có cái ngày sinh cũng không nhớ, nhập lại 😤");
    setTimeout(()=>input.classList.remove("shake"),400);
    result.innerText = "";
    return;
  }

  result.innerText = "Đúng rồi! Đợi nhận quà 💕💕";
  result.className = "success";

  let i = 0;
  const timer = setInterval(()=>{
    createHeart();
    i++;
    if(i > 20) clearInterval(timer);
  },120);

  // hiệu ứng mờ dần
  setTimeout(() => {
    transition.classList.add("show");
  }, 800);

  // chuyển trang
  setTimeout(() => {
    window.location.href = "qua.html";
  }, 1600);
}
</script>


</body>
</html>
